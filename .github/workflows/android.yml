name: Android ARM64 and host regression
on:
  push:
    branches: [android/arm64-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libboost-dev libfmt-dev nlohmann-json3-dev libzip-dev libsndfile1-dev zlib1g-dev portaudio19-dev libportaudiocpp0
      - run: ./scripts/test-host.sh -DENABLE_ADDRESS_SANITIZER=${{ matrix.sanitizer }}
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt linux android 6.11.2 android_arm64_v8a --autodesktop -m qtmultimedia -O "$RUNNER_TEMP/Qt"
      - name: Build native APK
        env:
          QT_ANDROID_PREFIX: ${{ runner.temp }}/Qt/6.11.2/android_arm64_v8a
          QT_HOST_PATH: ${{ runner.temp }}/Qt/6.11.2/gcc_64
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agbplay-android-arm64-debug
          path: build-android/**/*.apk
          if-no-files-found: error
