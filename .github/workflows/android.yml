name: Android ARM64 and host regression
on:
  push:
    branches: [android/arm64-native, android/audio-compatibility]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libboost-dev libfmt-dev nlohmann-json3-dev libzip-dev libsndfile1-dev zlib1g-dev portaudio19-dev libportaudiocpp0
      - run: ./scripts/test-host.sh -DENABLE_ADDRESS_SANITIZER=${{ matrix.sanitizer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-regression-${{ matrix.sanitizer }}
          path: build-test/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  touch-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libboost-dev libfmt-dev nlohmann-json3-dev libzip-dev libsndfile1-dev zlib1g-dev portaudio19-dev libportaudiocpp0 qt6-base-dev fonts-dejavu-core
      - name: Test responsive Qt Widgets UI offscreen
        env:
          AGBPLAY_UI_CAPTURE_DIR: ${{ runner.temp }}/ui-captures
        run: ./scripts/test-host.sh -DAGBPLAY_BUILD_GUI=ON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-captures
          path: ${{ runner.temp }}/ui-captures/*.png
          if-no-files-found: warn
  saf-documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/test-documents.sh
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated SAF regression APK
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" ./scripts/build-saf-tests.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android ContentResolver and pipe-backed providers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./scripts/test-saf-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saf-regression-results
          path: build-saf-tests/result.log
          if-no-files-found: warn
  android-touch-ui:
    # The same branch also has a PR workflow; run this emulator only once.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt linux android 6.11.2 android_x86_64 --autodesktop -m qtmultimedia -O "$RUNNER_TEMP/Qt"
      - name: Build real Qt Android UI probe
        env:
          QT_ANDROID_PREFIX: ${{ runner.temp }}/Qt/6.11.2/android_x86_64
          QT_HOST_PATH: ${{ runner.temp }}/Qt/6.11.2/gcc_64
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android-ui-probe.sh
          ./scripts/build-saf-tests.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android taps with native bars and Qt 6.11.2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python3 scripts/test-android-background.py qt
            python3 scripts/test-android-background.py audiotrack
            python3 scripts/test-android-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-ui-results
          path: build-android-ui/results/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt linux android 6.11.2 android_arm64_v8a --autodesktop -m qtmultimedia -O "$RUNNER_TEMP/Qt"
      - name: Build native APK
        env:
          QT_ANDROID_PREFIX: ${{ runner.temp }}/Qt/6.11.2/android_arm64_v8a
          QT_HOST_PATH: ${{ runner.temp }}/Qt/6.11.2/gcc_64
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android.sh
      - name: Verify APK ABI, ELF alignment and signature
        run: |
          apk=build-android/artifacts/agbplay-android-arm64-debug.apk
          test -n "$apk"
          python3 scripts/verify-apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: agbplay-android-arm64-debug
          path: build-android/artifacts/agbplay-android-arm64-debug.apk
          if-no-files-found: error
